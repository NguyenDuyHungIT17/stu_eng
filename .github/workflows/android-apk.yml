name: android-apk
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Nhúng vào bundle JS lúc build (biến EXPO_PUBLIC_*). Đặt trong Settings → Variables.
      EXPO_PUBLIC_API_BASE_URL: ${{ startsWith(github.ref, 'refs/tags/') && vars.API_BASE_URL_PROD || vars.API_BASE_URL_DEV }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile

      - name: Giải mã keystore (nếu đã cấu hình)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có ANDROID_KEYSTORE_BASE64 — APK sẽ ký bằng debug keystore (chỉ để thử)."
          fi

      - name: Expo prebuild
        run: pnpm --filter mobile exec expo prebuild --platform android --clean --no-install

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
