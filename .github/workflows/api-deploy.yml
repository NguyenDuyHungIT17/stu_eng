name: api-deploy
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["apps/api/**", "packages/**", "pnpm-lock.yaml", "package.json"]
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chọn môi trường
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "ENV_ARGS=--env prod" >> "$GITHUB_ENV"; echo "DB_NAME=english-app-quota-prod" >> "$GITHUB_ENV"
          else
            echo "ENV_ARGS=" >> "$GITHUB_ENV"; echo "DB_NAME=english-app-quota-dev" >> "$GITHUB_ENV"
          fi
      - name: Migrate D1
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply "$DB_NAME" --remote $ENV_ARGS
      - name: Deploy
        working-directory: apps/api
        run: pnpm exec wrangler deploy $ENV_ARGS
