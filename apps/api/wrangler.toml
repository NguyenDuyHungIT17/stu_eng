name = "english-app-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "local"
CHAT_PER_DEVICE = "40"
ASSIST_PER_DEVICE = "20"
REQ_PER_IP = "150"
GLOBAL_DAILY = "1500"

[[d1_databases]]
binding = "DB"
database_name = "english-app-quota-dev"
database_id = "00000000-0000-0000-0000-000000000000" # thay bằng id thật sau `wrangler d1 create`
migrations_dir = "migrations"

[triggers]
crons = ["0 18 * * *"] # 01:00 giờ Việt Nam: dọn bảng usage

[env.prod]
name = "english-app-api-prod"
vars = { APP_ENV = "prod", CHAT_PER_DEVICE = "40", ASSIST_PER_DEVICE = "20", REQ_PER_IP = "150", GLOBAL_DAILY = "1500" }
d1_databases = [
  { binding = "DB", database_name = "english-app-quota-prod", database_id = "00000000-0000-0000-0000-000000000000", migrations_dir = "migrations" }
]
triggers = { crons = ["0 18 * * *"] }
